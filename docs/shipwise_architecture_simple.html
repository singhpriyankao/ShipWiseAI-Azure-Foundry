<title>ShipWise AI At a Glance</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#F5F6F8; --fg:#18212D; --muted:#566273; --line:#6F7C8D; --panel:#ECEFF3; --lane:#E4E8EE;
  --code-f:#DDEBF8; --code-s:#3A76B0; --model-f:#E9E2F7; --model-s:#6A4DB1; --store-f:#DDF0E4; --store-s:#36855A;
  --ext-f:#F0F1F3; --ext-s:#7B8794; --human-f:#FBE6E1; --human-s:#B0503A; --eval-f:#FFF1CC; --eval-s:#A67C12;
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161C; --fg:#E7EBF1; --muted:#9AA6B6; --line:#7F8DA0; --panel:#1A2029; --lane:#202734;
  --code-f:#1B3047; --code-s:#6FA6DB; --model-f:#2B2347; --model-s:#A48DE6; --store-f:#17352A; --store-s:#5BBA85;
  --ext-f:#242A33; --ext-s:#8E99A8; --human-f:#40231D; --human-s:#E58C74; --eval-f:#3A3015; --eval-s:#D9B04A; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#12161C; --fg:#E7EBF1; --muted:#9AA6B6; --line:#7F8DA0; --panel:#1A2029; --lane:#202734;
  --code-f:#1B3047; --code-s:#6FA6DB; --model-f:#2B2347; --model-s:#A48DE6; --store-f:#17352A; --store-s:#5BBA85;
  --ext-f:#242A33; --ext-s:#8E99A8; --human-f:#40231D; --human-s:#E58C74; --eval-f:#3A3015; --eval-s:#D9B04A; color-scheme:dark;}
body{background:var(--bg);color:var(--fg);font-family:var(--font);}
.wrap{max-width:1680px;margin:0 auto;padding-inline:16px;padding-block:20px 32px;}
h1{font-size:1.5rem;font-weight:600;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px;max-width:75ch;line-height:1.5;font-size:.95rem}
.scroll{overflow-x:auto}
figure{margin:0;min-width:1100px}
svg{display:block;width:100%;height:auto;color:var(--line)}
figcaption{color:var(--muted);font-size:.85rem;line-height:1.5;margin-top:12px;max-width:100ch}
svg text{font-family:var(--font);fill:var(--fg)}
.t{font-size:13px}.bt{font-size:13.5px;font-weight:600}.bs{font-size:12px;fill:var(--muted)}
svg text.bs{fill:var(--fg);opacity:.82}
.lbl{font-size:11.5px;fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
svg text.lbl{fill:var(--muted)}
.col{font-size:11.5px;font-weight:600;letter-spacing:.09em;fill:var(--muted)}
svg text.col,svg text.colb,svg text.tag{fill:var(--muted)}
.colb{font-size:12.5px;font-weight:700;letter-spacing:.09em}
.tag{font-size:12px;font-weight:600;letter-spacing:.03em}
.b{stroke-width:1.4}
.code{fill:var(--code-f);stroke:var(--code-s)}.model{fill:var(--model-f);stroke:var(--model-s)}
.store{fill:var(--store-f);stroke:var(--store-s)}.ext{fill:var(--ext-f);stroke:var(--ext-s);stroke-dasharray:5 3}
.human{fill:var(--human-f);stroke:var(--human-s)}.eval{fill:var(--eval-f);stroke:var(--eval-s)}
.lane{fill:var(--lane);stroke:none}.band{fill:var(--panel);stroke:none}.sep{fill:var(--line);opacity:.4}
.a{fill:none;stroke:var(--line);stroke-width:1.5;stroke-linejoin:round}.a.dash{stroke-dasharray:6 4}

.bt{font-size:17px}.bs{font-size:14.5px}.lbl{font-size:13px}.col{font-size:13px}.colb{font-size:14px}.tag{font-size:13.5px}
.kind{font-size:12.5px;font-weight:600;letter-spacing:.04em}
svg text.kind{fill:var(--muted)}
</style>
<div class="wrap">
<h1>ShipWise AI at a glance</h1>
<p class="sub">A request goes to an orchestrator, three analysts answer in parallel, code checks the result, and the PM approves an option. What happens after launch feeds back into the next forecast.</p>
<div class="scroll"><figure><svg viewBox="0 0 1600 750" role="img" aria-label="ShipWise AI at a glance: a PM request goes to an orchestrator, which asks three analysts in parallel; code checks the answer; the PM sees a legal result and three options; approvals and reported outcomes loop back to improve forecasts; evals test it before and after release." xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect x="700" y="14" width="18" height="12" rx="2" class="b code"/><text x="725" y="25" class="lbl" text-anchor="start">Code</text><rect x="850" y="14" width="18" height="12" rx="2" class="b model"/><text x="875" y="25" class="lbl" text-anchor="start">Model or agent</text><rect x="1020" y="14" width="18" height="12" rx="2" class="b store"/><text x="1045" y="25" class="lbl" text-anchor="start">Data store</text><rect x="1170" y="14" width="18" height="12" rx="2" class="b human"/><text x="1195" y="25" class="lbl" text-anchor="start">Person / screen</text><rect x="1320" y="14" width="18" height="12" rx="2" class="b eval"/><text x="1345" y="25" class="lbl" text-anchor="start">Evaluation</text><text x="24" y="58" class="col" text-anchor="start">INPUT</text><text x="270" y="58" class="col" text-anchor="start">ENTRY + ORCHESTRATOR</text><text x="536" y="58" class="col" text-anchor="start">SUB-AGENTS · PARALLEL</text><text x="1032" y="58" class="col" text-anchor="start">CHECKS IN CODE</text><text x="1314" y="58" class="col" text-anchor="start">OUTPUT</text><rect x="24" y="190" width="190" height="140" rx="8" class="b human"/><text x="38" y="218" class="bt" text-anchor="start">PM</text><text x="38" y="242" class="bs" text-anchor="start">Describes an AI</text><text x="38" y="262" class="bs" text-anchor="start">feature and its</text><text x="38" y="282" class="bs" text-anchor="start">targets</text><rect x="270" y="170" width="210" height="180" rx="8" class="b code"/><text x="284" y="198" class="bt" text-anchor="start">Orchestrator</text><text x="466" y="197" class="kind" text-anchor="end">CODE</text><text x="284" y="222" class="bs" text-anchor="start">Signs the PM in,</text><text x="284" y="242" class="bs" text-anchor="start">reads the request</text><text x="284" y="262" class="bs" text-anchor="start">(small model), then</text><text x="284" y="282" class="bs" text-anchor="start">decides who to ask</text><rect x="536" y="90" width="440" height="100" rx="8" class="b model"/><text x="550" y="118" class="bt" text-anchor="start">Regulations</text><text x="962" y="117" class="kind" text-anchor="end">AGENT</text><text x="550" y="142" class="bs" text-anchor="start">EU AI Act answer with the</text><text x="550" y="162" class="bs" text-anchor="start">exact article quoted</text><rect x="536" y="210" width="440" height="100" rx="8" class="b model"/><text x="550" y="238" class="bt" text-anchor="start">Competitive</text><text x="962" y="237" class="kind" text-anchor="end">AGENT</text><text x="550" y="262" class="bs" text-anchor="start">Market claims, kept only if the</text><text x="550" y="282" class="bs" text-anchor="start">cited page backs them</text><rect x="536" y="330" width="440" height="100" rx="8" class="b code"/><text x="550" y="358" class="bt" text-anchor="start">Model Stack</text><text x="962" y="357" class="kind" text-anchor="end">CODE</text><text x="550" y="382" class="bs" text-anchor="start">Cost and speed worked out</text><text x="550" y="402" class="bs" text-anchor="start">in code from real prices</text><rect x="1032" y="170" width="230" height="180" rx="8" class="b code"/><text x="1046" y="198" class="bt" text-anchor="start">Checks</text><text x="1046" y="222" class="bs" text-anchor="start">Dates, citations and</text><text x="1046" y="242" class="bs" text-anchor="start">sources verified in</text><text x="1046" y="262" class="bs" text-anchor="start">code; one reply is</text><text x="1046" y="282" class="bs" text-anchor="start">written and checked</text><rect x="1314" y="170" width="262" height="180" rx="8" class="b human"/><text x="1328" y="198" class="bt" text-anchor="start">Results</text><text x="1328" y="222" class="bs" text-anchor="start">Legal result</text><text x="1328" y="242" class="bs" text-anchor="start">Three options (A, B, C)</text><text x="1328" y="262" class="bs" text-anchor="start">Approve button</text><text x="1328" y="282" class="bs" text-anchor="start">Dashboard</text><polyline points="214,260 270,260" class="a" marker-end="url(#ah)"/><text x="242" y="252" class="lbl" text-anchor="middle">request</text><polyline points="480,260 508,260" class="a" marker-end="url(#ah)"/><polyline points="508,140 508,380" class="a"/><polyline points="508,140 536,140" class="a" marker-end="url(#ah)"/><polyline points="508,260 536,260" class="a" marker-end="url(#ah)"/><polyline points="508,380 536,380" class="a" marker-end="url(#ah)"/><polyline points="976,140 1004,140" class="a"/><polyline points="976,260 1004,260" class="a"/><polyline points="976,380 1004,380" class="a"/><polyline points="1004,140 1004,380" class="a"/><polyline points="1004,260 1032,260" class="a" marker-end="url(#ah)"/><text x="1004" y="408" class="lbl" text-anchor="middle">findings</text><polyline points="1262,260 1314,260" class="a" marker-end="url(#ah)"/><text x="1288" y="252" class="lbl" text-anchor="middle">reply</text><rect x="24" y="470" width="1238" height="40" rx="8" class="b store"/><text x="643" y="496" class="bt" text-anchor="middle">Memory: every run is saved (Cosmos DB), so it can be learned from and reviewed</text><polyline points="1147,350 1147,470" class="a" marker-end="url(#ah)"/><text x="1157" y="420" class="lbl" text-anchor="start">every run saved</text><polyline points="756,470 756,430" class="a" marker-end="url(#ah)"/><text x="766" y="458" class="lbl" text-anchor="start">better forecasts</text><rect x="24" y="545" width="1552" height="110" rx="10" class="band"/><text x="48" y="575" class="colb" text-anchor="start">LEARNING LOOP</text><text x="48" y="600" class="bs" text-anchor="start">A PM's real results make</text><text x="48" y="620" class="bs" text-anchor="start">the next forecast better.</text><rect x="1314" y="560" width="262" height="80" rx="8" class="b human"/><text x="1328" y="588" class="bt" text-anchor="start">Approve</text><text x="1328" y="612" class="bs" text-anchor="start">saves the forecast</text><rect x="1010" y="560" width="230" height="80" rx="8" class="b model"/><text x="1024" y="588" class="bt" text-anchor="start">Report back</text><text x="1024" y="612" class="bs" text-anchor="start">PM says what happened</text><rect x="660" y="560" width="290" height="80" rx="8" class="b code"/><text x="674" y="588" class="bt" text-anchor="start">Learn</text><text x="674" y="612" class="bs" text-anchor="start">corrects forecasts, per company</text><polyline points="1445,350 1445,560" class="a" marker-end="url(#ah)"/><text x="1455" y="470" class="lbl" text-anchor="start">Approve</text><polyline points="1314,600 1240,600" class="a" marker-end="url(#ah)"/><text x="1277" y="590" class="lbl" text-anchor="middle">weeks later</text><polyline points="1010,600 950,600" class="a" marker-end="url(#ah)"/><polyline points="805,510 805,560" class="a" marker-end="url(#ah)" marker-start="url(#ah)"/><text x="815" y="538" class="lbl" text-anchor="start">reads reports, writes corrections</text><rect x="24" y="672" width="1552" height="62" rx="10" class="band"/><text x="48" y="709" class="colb" text-anchor="start">EVALS</text><rect x="150" y="682" width="660" height="42" rx="8" class="b eval"/><text x="164" y="708" class="bs" text-anchor="start">Before release: routing and extraction tests, 19 reviewed cases</text><rect x="830" y="682" width="730" height="42" rx="8" class="b eval"/><text x="844" y="708" class="bs" text-anchor="start">After release: a person reviews real runs; checks are compared with their labels</text></svg>
